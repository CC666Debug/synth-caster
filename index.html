<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Synth Caster</title>
<meta name="description" content="Hundreds of synthwave, darkwave, synth-pop and chiptune radio streams. Search, sort, shuffle, and cast to Nest speakers.">
<meta name="theme-color" content="#0d0a1a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --neon: #ff4fb8;   /* the volume number's glow */
    --bg: #0d0a1a;
    --surface: #17122b;
    --surface-2: #221a3d;
    --line: #342a57;
    --text: #f1ecff;
    --muted: #a79dc9;
    --accent: #ff3fa4;
    --accent-2: #33e1ff;
    --accent-ink: #1a0514;
    --good: #6ff0a8;
    --warn: #ffcf5c;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    background-image: linear-gradient(180deg, rgba(255, 63, 164, .10), transparent 260px);
    color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100dvh;
    padding: 0 16px max(24px, env(safe-area-inset-bottom));
    -webkit-tap-highlight-color: transparent;
  }
  main { max-width: 560px; min-width: 0; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  h1 { font-size: 19px; margin: 0; letter-spacing: .2px; white-space: nowrap; cursor: default; user-select: none; }
  h1 span { background: linear-gradient(90deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  @media (max-width: 380px) { h1 { font-size: 17px; } .cast-btn { padding: 9px 12px; } }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; }
  button:disabled { opacity: .45; cursor: default; }

  .cast-btn {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--surface-2); border: 1px solid var(--line);
    padding: 10px 14px; border-radius: 999px; max-width: 60%;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .cast-btn svg { flex: none; width: 20px; height: 20px; }
  .cast-btn.connected { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .cast-btn.connecting svg { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  .cast-btn.nudge { border-color: var(--accent); animation: glow 1.2s ease-in-out infinite; }
  @keyframes glow { 50% { box-shadow: 0 0 0 4px rgba(255, 63, 164, .35); } }
  @media (prefers-reduced-motion: reduce) { .cast-btn.nudge { animation: none; } }

  .notice {
    background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--warn);
    padding: 12px 14px; border-radius: 12px; color: var(--muted); font-size: 14px;
  }
  .notice[hidden] { display: none; }

  /* Now playing and the controls share one slim card. */
  .player {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 10px 12px 6px; display: flex; flex-direction: column; gap: 4px;
  }
  .now { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 10px; align-items: center; }
  .badge {
    width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; font-size: 22px;
    background: linear-gradient(135deg, #3a1a5c, #13304a);
  }
  .now .label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .now .label .state { text-transform: none; letter-spacing: 0; }
  .now .label .state.live { color: var(--good); }
  .now .title { font-weight: 650; font-size: 15px; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .now .song { font-size: 13px; color: var(--accent-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .now .song:empty { display: none; }
  /* Up next, listeners and LIVE, Save and Share, and the Recently played / Saved songs panel (from Halloween Caster). */
  .now .next { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .now .next:empty { display: none; }
  .now .label .crowd { text-transform: none; letter-spacing: 0; }
  .now .label .crowd b { color: #ff5a5a; font-weight: 700; }
  button.pill { cursor: pointer; }
  .drawer ul { list-style: none; margin: 0 0 8px; padding: 0; }
  .drawer li { border-top: 1px solid var(--line); padding: 9px 0; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 3px 10px; }
  .drawer .f-song { font-weight: 600; overflow-wrap: anywhere; }
  .drawer .f-meta { font-size: 12px; color: var(--muted); grid-column: 1; }
  .drawer .f-links { grid-column: 1; display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; }
  .drawer .f-links a { color: var(--accent-2); text-decoration: none; }
  .drawer .li-btn { grid-column: 2; grid-row: 1 / span 3; align-self: center; background: none; color: var(--muted); font-size: 18px; padding: 8px; }
  .drawer .empty { color: var(--muted); font-size: 14px; margin: 0 0 12px; }
  .drawer .empty[hidden] { display: none; }
  /* Recently played and Saved songs slide up from the bottom, over the page. */
  dialog.sheet {
    inset: auto 0 0 0; margin: 0 auto; width: min(560px, 100%); max-width: 100%; max-height: 78vh; overflow: auto;
    padding: 0 16px max(14px, env(safe-area-inset-bottom)); border-radius: 18px 18px 0 0; border-bottom: 0;
    animation: sheet-up .22s ease-out;
  }
  .sheet header { position: sticky; top: 0; z-index: 1; background: var(--surface); display: flex; align-items: center; gap: 10px; padding: 14px 0 8px; }
  .sheet h2 { margin: 0; font-size: 17px; flex: 1; }
  .sheet .close { background: none; color: var(--muted); font-size: 20px; padding: 4px 8px; }
  .sheet .sub { color: var(--muted); font-size: 13px; margin: 0 0 6px; }
  .sheet .sub:empty { display: none; }
  .sheet section[hidden] { display: none; }
  @keyframes sheet-up { from { transform: translateY(40px); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { dialog.sheet { animation: none; } }
  .links { display: flex; gap: 8px; flex-wrap: wrap; padding: 2px 0 6px; }
  .links[hidden] { display: none; }
  .pill {
    font-size: 12.5px; padding: 6px 11px; border-radius: 999px; white-space: nowrap; text-decoration: none;
    background: var(--surface); border: 1px solid var(--line); color: var(--muted);
  }
  .pill.on { color: var(--text); border-color: var(--accent); }
  /* How far into the song (stations whose song feed says how long it is). */
  .prog { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .prog[hidden] { display: none; }
  .prog .bar { flex: 1; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
  .prog .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 1s linear; }
  /* The song clock beside the time bar: an 80s cassette winding from one reel to the other. */
  .omen { flex: none; display: grid; place-items: center; min-width: 30px; height: 34px; }
  .omen svg { display: block; overflow: visible; }
  .omen svg * { transition: transform 1s linear, opacity 1s linear, fill 1s linear; }
  .omen.reset svg * { transition: none !important; }
  .omen .rot, .omen .sink, .omen .wax, .omen .top { transform-box: view-box; }
  .omen .flame { transform-box: view-box; transform-origin: 10px -4px; animation: omen-flicker .9s ease-in-out infinite alternate; filter: drop-shadow(0 0 3px #ff2a1a); }
  .omen .glow { animation: omen-glow 1.6s ease-in-out infinite alternate; }
  .omen .moonlit { filter: drop-shadow(0 0 3px rgba(201, 214, 232, .7)); }
  @keyframes omen-flicker {
    0%   { transform: scale(1, 1) skewX(0deg); }
    30%  { transform: scale(.92, 1.08) skewX(3deg); }
    60%  { transform: scale(1.05, .95) skewX(-2deg); }
    100% { transform: scale(.97, 1.04) skewX(1deg); }
  }
  @keyframes omen-glow { from { filter: brightness(1); } to { filter: brightness(1.25); } }
  .omen .spin { transform-box: view-box; animation: omen-spin 2.4s linear infinite; }
  @keyframes omen-spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .omen .flame, .omen .glow, .omen .spin { animation: none; } }
  .prog-time { background: none; padding: 4px 0; color: inherit; font: inherit; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .badge { overflow: hidden; }
  .badge img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .row { display: flex; align-items: center; gap: 2px; }
  .play {
    width: 46px; height: 46px; border-radius: 50%; flex: none; margin: 0 2px;
    background: var(--accent); color: var(--accent-ink); display: grid; place-items: center;
  }
  .play svg { width: 24px; height: 24px; }
  .icon-btn { background: none; padding: 9px; display: grid; place-items: center; color: var(--muted); border-radius: 50%; flex: none; }
  .icon-btn svg { width: 22px; height: 22px; }
  .icon-btn[hidden] { display: none; }
  .icon-btn.on { color: var(--accent-2); background: rgba(51, 225, 255, .12); }
  /* The volume lives in a pop-up now (hold 🔊), so the row of controls spreads out. */
  #vol { display: none; }
  @media (max-width: 370px) { .row .icon-btn { padding: 7px; } .volnum { min-width: 40px; margin-left: -2px; font-size: 14px; } }   /* narrow phones, with the ✕ while casting */
  .row { justify-content: space-between; }
  #muteBtn { touch-action: none; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
  .volpop {
    position: fixed; z-index: 60; width: 56px; height: 200px; padding: 10px 0 12px; border-radius: 28px;
    background: var(--surface-2); border: 1px solid var(--line); box-shadow: 0 8px 28px rgba(0, 0, 0, .55);
    display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none;
  }
  .volpop[hidden] { display: none; }
  /* The volume number in the realm's own neon, big enough to read across the room. */
  .volnum { min-width: 44px; margin-left: -4px; font-size: 15px; font-weight: 800; color: var(--neon); text-shadow: 0 0 4px var(--neon), 0 0 12px var(--neon); font-variant-numeric: tabular-nums; }
  .volpop .pct { font-size: 18px; font-weight: 800; color: var(--neon); text-shadow: 0 0 4px var(--neon), 0 0 12px var(--neon); font-variant-numeric: tabular-nums; }
  .volpop .track { position: relative; flex: 1; width: 12px; border-radius: 6px; background: var(--line); overflow: hidden; }
  .volpop .fill { position: absolute; left: 0; right: 0; bottom: 0; background: var(--accent); }
  .volpop .who { font-size: 10px; letter-spacing: .5px; text-transform: uppercase; color: var(--muted); }

  /* The player, search, genres and sort stay pinned at the top while the station list scrolls under them. */
  .top {
    position: sticky; top: 0; z-index: 3; display: flex; flex-direction: column; gap: 8px;
    background: var(--bg); padding: max(12px, env(safe-area-inset-top)) 0 8px;
    box-shadow: 0 10px 12px -6px var(--bg);
  }
  @media (max-height: 560px) { .top { position: static; box-shadow: none; } }   /* phone on its side: too short to pin */
  /* Mini mode: once you scroll down the list, the whole top shrinks to one slim player bar and a slim search.
     Any scroll up (or a tap on the bar) brings the full player back. */
  .topbar { display: flex; flex-direction: column; gap: 8px; }
  .icon-btn.mini-cast { display: none; }
  html { overflow-anchor: none; }   /* stop the browser's scroll anchoring from yanking the page while the top shrinks */
  .top.mini { gap: 6px; padding-top: max(6px, env(safe-area-inset-top)); padding-bottom: 6px; }
  .top.mini .sky, .top.mini .tools, .top.mini .notice, .top.mini .now .next, .top.mini .links, .top.mini .search-row,
  .top.mini #shuffleBtn, .top.mini #prevBtn, .top.mini #muteBtn, .top.mini .volnum, .top.mini #disconnectBtn,
  .top.mini .prog .omen, .top.mini .prog-time { display: none !important; }
  .top.mini .player { position: relative; flex-direction: row; align-items: center; gap: 6px; padding: 7px 5px 7px 7px; border-radius: 12px; overflow: hidden; }
  .top.mini .now { flex: 1; min-width: 0; grid-template-columns: 40px minmax(0, 1fr); gap: 10px; cursor: pointer; }
  .top.mini .badge { width: 40px; height: 40px; border-radius: 9px; font-size: 19px; }
  .top.mini .badge svg { width: 22px; height: 22px; }
  .top.mini .now .title { font-size: 14.5px; line-height: 1.2; }
  .top.mini .now .song { font-size: 12px; }
  /* In the mini bar the listener count (and LIVE DJ) sits to the right of the station name, on the same line;
     the rest of the top line goes, so there's no empty space above the name. */
  .top.mini .now > div:last-child { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 7px; }
  .top.mini .now .label { display: contents; }
  .top.mini .now .label #where, .top.mini .now .label .state, .top.mini .crowd .sep:first-child { display: none; }
  .top.mini .now .title { order: 1; flex: 0 1 auto; min-width: 0; max-width: calc(100% - 4.2em); }   /* a long name gives way (…) so the count always fits beside it */
  .top.mini .now .label .crowd { order: 2; flex: none; font-size: 11px; letter-spacing: 0; text-transform: none; color: var(--muted); white-space: nowrap; }
  .top.mini .now .song { order: 3; flex: 0 0 100%; min-width: 0; }
  /* Slim genre pills ride along under the mini bar. */
  .top.mini .finder { gap: 0; }
  .top.mini .chips { gap: 5px; padding-bottom: 0; }
  .top.mini .chip { padding: 3px 10px; font-size: 12px; }
  .top.mini .chip b { font-size: 10.5px; }
  .top.mini .row { flex: none; gap: 0; justify-content: flex-end; }
  .top.mini .play { width: 40px; height: 40px; margin: 0 2px; }
  .top.mini .play svg { width: 21px; height: 21px; }
  .top.mini .row .icon-btn { padding: 8px; }
  .top.mini .row .icon-btn svg { width: 21px; height: 21px; }
  .top.mini .topbar { gap: 0; }
  .top.mini header { zoom: .8; }   /* the top line stays, just smaller */
  .top.mini .prog { position: absolute; left: 0; right: 0; bottom: 0; gap: 0; }
  .top.mini .prog .bar { height: 2px; border-radius: 0; background: transparent; }
  .top.mini .prog .bar i { background: var(--neon); box-shadow: 0 0 4px var(--neon); }
  /* Phones draw their own clear-X in search boxes; the app has its own ✕, so hide the built-in one. */
  input[type="search"]::-webkit-search-cancel-button, input[type="search"]::-webkit-search-decoration { -webkit-appearance: none; appearance: none; display: none; }
  .backup { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 2px; }
  /* The shrink is a morph: the art, names, buttons and search glide into their mini places while the panel
     closes up from the bottom and the list slides up with it (names are only set while it runs). */
  .top.vt { view-transition-name: mini-top; }
  .top.vt header { view-transition-name: mini-head; }
  .top.vt #badge { view-transition-name: mini-badge; }
  .top.vt #nowName { view-transition-name: mini-name; }
  .top.vt #nowSong { view-transition-name: mini-song; }
  .top.vt #playBtn { view-transition-name: mini-play; }
  .top.vt #nextBtn { view-transition-name: mini-next; }
  .top.vt .finder .search { view-transition-name: mini-search; }
  .top.vt .chips { view-transition-name: mini-chips; }
  /* The page under the bar slides by exactly the amount the player shrinks, on the same curve, so the list stays
     glued to the player's bottom edge the whole way (the top station never slips out of sight). */
  ::view-transition-old(root), ::view-transition-new(root) { mix-blend-mode: normal; animation-duration: .34s; animation-timing-function: cubic-bezier(.25, .8, .25, 1); }
  ::view-transition-old(root) { animation-name: mini-root-old; }
  ::view-transition-new(root) { animation-name: mini-root-new; }
  @keyframes mini-root-old { to { transform: translateY(calc(-1 * var(--mini-shift, 0px))); } }
  @keyframes mini-root-new { from { transform: translateY(var(--mini-shift, 0px)); } }
  ::view-transition-group(*) { animation-duration: .34s; animation-timing-function: cubic-bezier(.25, .8, .25, 1); }
  ::view-transition-image-pair(mini-top) { overflow: hidden; }
  ::view-transition-old(mini-top), ::view-transition-new(mini-top) { height: 100%; object-fit: none; object-position: top; }
  ::view-transition-old(mini-name), ::view-transition-new(mini-name), ::view-transition-old(mini-song), ::view-transition-new(mini-song) { height: 100%; object-fit: none; object-position: left center; }
  /* The speaker icon blares: up to three neon sound waves (more as it gets louder), pulsing while music plays. */
  #muteBtn { color: var(--neon); }
  #muteBtn svg { width: 26px; height: 24px; }
  #muteBtn.muted { color: var(--muted); }
  #volIcon .wave { fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; opacity: .16; }
  #volIcon .wave.on { stroke: var(--neon); opacity: 1; filter: drop-shadow(0 0 2px var(--neon)); }
  #muteBtn.blaring #volIcon .wave.on { animation: blare 1.1s ease-out infinite; }
  #muteBtn.blaring #volIcon .w2.on { animation-delay: .15s; }
  #muteBtn.blaring #volIcon .w3.on { animation-delay: .3s; }
  @keyframes blare { 0% { opacity: .35; } 30% { opacity: 1; } 100% { opacity: .5; } }
  @media (prefers-reduced-motion: reduce) { #muteBtn.blaring #volIcon .wave.on { animation: none; } }
  @media (max-width: 380px) { .row .icon-btn { padding: 6px; } .volnum { min-width: 30px; margin-left: 0; font-size: 13px; } }
  .finder { display: flex; flex-direction: column; gap: 8px; }
  .search-row { display: flex; gap: 8px; }
  .search-row .search { flex: 1; min-width: 0; }
  .to-top {
    position: fixed; right: 16px; bottom: max(20px, env(safe-area-inset-bottom)); z-index: 4;
    width: 50px; height: 50px; border-radius: 50%; display: grid; place-items: center;
    background: var(--surface-2); border: 1px solid var(--accent-2); color: var(--accent-2);
    box-shadow: 0 4px 14px rgba(0, 0, 0, .5); transition: opacity .2s, transform .2s;
  }
  .to-top svg { width: 26px; height: 26px; }
  .to-top.hide { opacity: 0; transform: translateY(12px); pointer-events: none; }
  .search { position: relative; }
  .search input {
    width: 100%; font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--line);
    border-radius: 12px; padding: 10px 34px 10px 38px; outline: none;
  }
  .search input:focus { border-color: var(--accent-2); }
  .search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); }
  .search button { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); background: none; color: var(--muted); padding: 8px 10px; font-size: 18px; line-height: 1; }
  .search button[hidden] { display: none; }
  .chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .chips::-webkit-scrollbar { display: none; }
  @media (pointer: fine) { .chips { cursor: grab; } .chips.dragging { cursor: grabbing; user-select: none; } }
  .chip {
    flex: none; background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
    padding: 7px 12px; font-size: 14px; white-space: nowrap; color: var(--muted);
  }
  .chip.on { background: var(--surface-2); border-color: var(--accent); color: var(--text); }
  .chip b { font-weight: 400; opacity: .7; margin-left: 4px; font-size: 12px; }
  .sort {
    flex: none; width: 108px; font: inherit; font-size: 14px; color: var(--text); background: var(--surface);
    border: 1px solid var(--line); border-radius: 12px; padding: 0 8px;
  }
  .count { font-size: 12px; color: var(--muted); margin: -2px 0 -4px; }

  .list { display: flex; flex-direction: column; gap: 6px; }
  .st {
    display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line);
    border-radius: 12px; padding: 4px 4px 4px 12px; min-height: 52px;
  }
  .st.active { border-color: var(--accent); background: var(--surface-2); }
  .st.failed .nm { opacity: .55; }
  .st .pick { flex: 1; min-width: 0; text-align: left; background: none; padding: 8px 0; display: flex; flex-direction: column; gap: 2px; }
  .st .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .st .gr { font-size: 12px; color: var(--muted); }
  .st .dot { display: none; width: 8px; height: 8px; border-radius: 50%; background: var(--good); margin-right: 6px; vertical-align: middle; }
  .st.active .dot { display: inline-block; }
  .star { background: none; font-size: 20px; padding: 10px; color: var(--muted); line-height: 1; }
  .star.on { color: var(--warn); }
  .empty { text-align: center; color: var(--muted); padding: 30px 10px; }
  .more { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; color: var(--muted); }

  dialog { background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; width: min(520px, calc(100vw - 32px)); }
  dialog::backdrop { background: rgba(0, 0, 0, .6); }
  #diagText { max-height: 55vh; overflow: auto; font-size: 11px; white-space: pre-wrap; background: var(--bg); padding: 8px; border-radius: 8px; }
  .dlg-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px; }
  .dlg-btns button { background: var(--surface-2); border: 1px solid var(--line); padding: 8px 12px; border-radius: 8px; }
  footer { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; color: var(--muted); font-size: 12px; padding: 14px 0 6px; }
  footer .foot-tag { color: var(--accent-2); font-size: 13px; letter-spacing: 2px; text-transform: uppercase; }
  footer .foot-ver { font-size: 11px; letter-spacing: 1.5px; opacity: .8; }

<script>
const VERSION = '1.17.0';
const $ = id => document.getElementById(id);
const els = {
  castBtn: $('castBtn'), castLabel: $('castLabel'), notice: $('notice'), where: $('where'),
  nowName: $('nowName'), nowSong: $('nowSong'), nowState: $('nowState'), badge: $('badge'), playBtn: $('playBtn'), playIcon: $('playIcon'),
  prevBtn: $('prevBtn'), nextBtn: $('nextBtn'), shuffleBtn: $('shuffleBtn'), disconnectBtn: $('disconnectBtn'),
  muteBtn: $('muteBtn'), volIcon: $('volIcon'), vol: $('vol'), q: $('q'), qClear: $('qClear'),
  chips: $('chips'), sort: $('sort'), count: $('count'), list: $('list'),
};
$('ver').textContent = 'V' + VERSION;

function safeGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function safeSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function loadJSON(k, fallback) { try { return JSON.parse(safeGet(k)) || fallback; } catch (e) { return fallback; } }

// ── Diagnostic log (tap the title 5 times) ──────
const DIAG_KEY = 'sc_diag';
let diagLines = loadJSON(DIAG_KEY, []);
function diag(msg) {
  const t = new Date();
  diagLines.push(t.toLocaleTimeString() + '  ' + msg);
  if (diagLines.length > 300) diagLines = diagLines.slice(-300);
  safeSet(DIAG_KEY, JSON.stringify(diagLines));
}
// How it was opened: its own app window (installed) or an ordinary browser tab.
const openedAs = ['standalone', 'minimal-ui', 'fullscreen', 'browser'].find(m => matchMedia('(display-mode: ' + m + ')').matches) || 'unknown';
diag('── opened · Synth Caster v' + VERSION + ' · ' + (openedAs === 'browser' ? 'browser tab' : 'app window (' + openedAs + ')')
  + (document.referrer ? ' · from ' + document.referrer : '') + ' · ' + navigator.userAgent);

const GENRES = [
  { id: 'Synthwave / Retrowave', label: '🌆 Synthwave', icon: '🌆' },
  { id: 'Darkwave / Goth / Industrial', label: '🦇 Darkwave & Goth', icon: '🦇' },
  { id: 'Synth-Pop & New Wave', label: '🎹 Synth-Pop & New Wave', icon: '🎹' },
  { id: 'Chiptune / Game', label: '👾 Chiptune & Game', icon: '👾' },
];
const iconFor = s => (GENRES.find(g => g.id === s.group) || {}).icon || '📻';
const shortGenre = s => ((GENRES.find(g => g.id === s.group) || {}).label || s.group).replace(/^\S+ /, '');

let STATIONS = [];
let favs = new Set(loadJSON('sc_favs', []));
let recent = loadJSON('sc_recent', {});      // id -> last played time
let failed = loadJSON('sc_failed', {});      // id -> time it last failed to play
let filter = safeGet('sc_filter') || 'all';
let sortBy = safeGet('sc_sort') || 'az';
let shuffle = safeGet('sc_shuffle') === '1';
let query = '';
let selected = null;           // the station shown in Now playing
let history = [];              // stations played this visit, for the Previous button
let randomOrder = new Map();   // id -> random number, for the Random sort
const PAGE = 120;              // stations drawn at a time (the list is long)
let shown = PAGE;

els.sort.value = sortBy;

// ── Station list: search, genre, sort ───────────
function norm(s) { return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }

function visible() {
  const words = norm(query).split(/\s+/).filter(Boolean);
  let list = STATIONS.filter(s => {
    if (filter === 'favs' && !favs.has(s.id)) return false;
    if (filter !== 'all' && filter !== 'favs' && s.group !== filter) return false;
    return words.every(w => s.search.includes(w));
  });
  const byName = (a, b) => a.sortName.localeCompare(b.sortName);
  const cmp = {
    az: byName,
    za: (a, b) => byName(b, a),
    genre: (a, b) => GENRES.findIndex(g => g.id === a.group) - GENRES.findIndex(g => g.id === b.group) || byName(a, b),
    recent: (a, b) => (recent[b.id] || 0) - (recent[a.id] || 0) || byName(a, b),
    favs: (a, b) => favs.has(b.id) - favs.has(a.id) || byName(a, b),
    random: (a, b) => randomOrder.get(a.id) - randomOrder.get(b.id),
  }[sortBy] || byName;
  return list.sort(cmp);
}

function renderChips() {
  const counts = { all: STATIONS.length, favs: STATIONS.filter(s => favs.has(s.id)).length };
  GENRES.forEach(g => { counts[g.id] = STATIONS.filter(s => s.group === g.id).length; });
  const chips = [{ id: 'all', label: 'All' }, { id: 'favs', label: '★ Favorites' }, ...GENRES];
  els.chips.innerHTML = '';
  chips.forEach(c => {
    const b = document.createElement('button');
    b.className = 'chip' + (filter === c.id ? ' on' : '');
    b.setAttribute('role', 'tab');
    b.setAttribute('aria-selected', filter === c.id);
    b.innerHTML = `${c.label}<b>${counts[c.id]}</b>`;
    b.addEventListener('click', () => { filter = c.id; safeSet('sc_filter', filter); shown = PAGE; renderChips(); renderList(); listToTop(); });
    els.chips.appendChild(b);
  });
}

function esc(t) { return t.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

function renderList() {
  const list = visible();
  els.count.textContent = list.length === 1 ? '1 station' : list.length + ' stations';
  els.list.innerHTML = '';
  if (!list.length) {
    els.list.innerHTML = `<div class="empty">${filter === 'favs' && !query ? 'No favorites yet. Tap ☆ on a station to add it.' : 'No stations match.'}</div>`;
    return;
  }
  const frag = document.createDocumentFragment();
  list.slice(0, shown).forEach(s => {
    const row = document.createElement('div');
    row.className = 'st' + (s === playingStation() ? ' active' : '') + (failed[s.id] ? ' failed' : '');
    row.innerHTML = `<button class="pick"><span class="nm"><span class="dot"></span>${esc(s.name)}</span>`
      + `<span class="gr">${iconFor(s)} ${esc(shortGenre(s))}${s.meta ? ' · ♪ song names' : ''}${failed[s.id] ? ' · didn’t play last time' : s.insecure ? ' · older link, may not play on phones' : ''}</span></button>`
      + `<button class="star${favs.has(s.id) ? ' on' : ''}" aria-label="${favs.has(s.id) ? 'Remove from' : 'Add to'} favorites">${favs.has(s.id) ? '★' : '☆'}</button>`;
    row.querySelector('.pick').addEventListener('click', () => chooseStation(s));
    row.querySelector('.star').addEventListener('click', () => toggleFav(s));
    frag.appendChild(row);
  });
  if (list.length > shown) {
    const more = document.createElement('button');
    more.className = 'more';
    more.textContent = `Show ${Math.min(PAGE, list.length - shown)} more (${list.length - shown} left)`;
    more.addEventListener('click', () => { shown += PAGE; renderList(); });
    frag.appendChild(more);
  }
  els.list.appendChild(frag);
}

function toggleFav(s) {
  favs.has(s.id) ? favs.delete(s.id) : favs.add(s.id);
  safeSet('sc_favs', JSON.stringify([...favs]));
  renderChips(); renderList();
}

let qTimer = null;
els.q.addEventListener('input', () => {
  els.qClear.hidden = !els.q.value;
  clearTimeout(qTimer);
  qTimer = setTimeout(() => { query = els.q.value; shown = PAGE; renderList(); listToTop(); }, 120);
});
els.qClear.addEventListener('click', () => { els.q.value = ''; query = ''; els.qClear.hidden = true; shown = PAGE; renderList(); listToTop(); els.q.focus(); });
els.sort.addEventListener('change', () => {
  sortBy = els.sort.value; safeSet('sc_sort', sortBy);
  if (sortBy === 'random') reshuffleOrder();
  shown = PAGE; renderList(); listToTop();
});
// On a computer, the genre bar scrolls by click-and-drag or the mouse wheel (phones just swipe).
{
  const bar = els.chips;
  let startX = 0, startScroll = 0, dragging = false, moved = false;
  bar.addEventListener('pointerdown', e => {
    if (e.pointerType !== 'mouse' || e.button !== 0) return;
    dragging = true; moved = false;
    startX = e.clientX; startScroll = bar.scrollLeft;
  });
  addEventListener('pointermove', e => {
    if (!dragging) return;
    const dx = e.clientX - startX;
    if (Math.abs(dx) > 4) { moved = true; bar.classList.add('dragging'); }
    if (moved) bar.scrollLeft = startScroll - dx;
  });
  addEventListener('pointerup', () => { dragging = false; bar.classList.remove('dragging'); });
  // A drag shouldn't also pick the genre it ended on.
  bar.addEventListener('click', e => { if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; } }, true);
  bar.addEventListener('wheel', e => {
    if (!e.deltaY || bar.scrollWidth <= bar.clientWidth) return;
    e.preventDefault();
    bar.scrollLeft += e.deltaY;
  }, { passive: false });
}
// A new search, genre or sort starts the list from its top.
function listToTop() { if (scrollY > 0) scrollTo({ top: 0 }); }
// Back to top: shows once you've scrolled a good way down the list.
{
  const btn = $('toTop');
  const check = () => btn.classList.toggle('hide', scrollY < 400);
  addEventListener('scroll', check, { passive: true });
  btn.addEventListener('click', () => scrollTo({ top: 0, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }));
}
function reshuffleOrder() { randomOrder = new Map(STATIONS.map(s => [s.id, Math.random()])); }

// ── Choosing stations, shuffle, next and previous ─
function chooseStation(s, fromSkip = false) {
  // Tapping the station that's already playing stops it.
  if (!fromSkip && s === playingStation()) { els.playBtn.click(); return; }
  if (selected && selected !== s) history.push(selected);
  if (history.length > 50) history = history.slice(-50);
  selected = s;
  safeSet('sc_station', s.id);
  recent[s.id] = Date.now();
  safeSet('sc_recent', JSON.stringify(recent));
  if (castConnected()) loadStation(s);
  else playHere(s);
  render();
}

// The next station: a random one from the list you're looking at (shuffle), or the one below.
function nextStation() {
  let list = visible();
  if (!list.length) list = STATIONS;
  if (shuffle || !selected) {
    // Avoid the last 20 played and ones that just failed, when there are enough others.
    const recentIds = new Set(history.slice(-20).map(s => s.id).concat(selected ? [selected.id] : []));
    // Older http-only links usually can't play on a phone (the app is a secure page), so shuffle skips them there.
    const playable = s => !failed[s.id] && (castConnected() || !s.insecure);
    let pool = list.filter(s => !recentIds.has(s.id) && playable(s));
    if (!pool.length) pool = list.filter(s => s !== selected && playable(s));
    if (!pool.length) pool = list.filter(s => s !== selected);
    if (!pool.length) pool = list;
    return pool[Math.floor(Math.random() * pool.length)];
  }
  const i = list.indexOf(selected);
  return list[(i + 1) % list.length];
}
function goNext() { chooseStation(nextStation(), true); }
function goPrev() {
  if (shuffle || !selected) {
    const s = history.pop();
    if (s) { selected = null; chooseStation(s, true); }
    return;
  }
  const list = visible();
  const i = list.indexOf(selected);
  chooseStation(list[(i - 1 + list.length) % list.length], true);
}
els.nextBtn.addEventListener('click', goNext);
els.prevBtn.addEventListener('click', goPrev);
els.shuffleBtn.addEventListener('click', () => {
  shuffle = !shuffle;
  safeSet('sc_shuffle', shuffle ? '1' : '0');
  diag('shuffle ' + (shuffle ? 'on' : 'off'));
  // Nothing playing yet: shuffle starts a random station straight away.
  if (shuffle && !playingStation() && !castActive()) goNext();
  render();
});

// A station that won't play: remember it, and with shuffle on, move to another one.
let skipsInARow = 0;
function stationFailed(s, why) {
  diag('FAILED ' + s.name + ' · ' + why);
  failed[s.id] = Date.now();
  safeSet('sc_failed', JSON.stringify(failed));
  if (shuffle && skipsInARow < 8) {
    skipsInARow++;
    showNotice(s.name + ' isn’t playing right now. Shuffling to another station…');
    setTimeout(goNext, 800);
  } else {
    skipsInARow = 0;
    showNotice(s.name + ' isn’t playing right now. Try another station, or tap ⏭.');
  }
  renderList();
}
function stationWorked(s) {
  skipsInARow = 0;
  if (failed[s.id]) { delete failed[s.id]; safeSet('sc_failed', JSON.stringify(failed)); renderList(); }
}

// ── Casting (Google Cast, Chrome only) ──────────
let ctx = null, player = null, ctrl = null;
let speakerLoading = null, speakerStation = null, speakerRetries = 0, speakerReconnecting = false;
let carryOver = null;

window.__onGCastApiAvailable = function (available) {
  diag('cast library ready: ' + (available && window.cast && cast.framework ? 'yes' : 'NO'));
  if (!available || !window.cast || !cast.framework) {
    els.castLabel.textContent = 'Unavailable';
    els.castBtn.title = 'Casting to speakers needs Chrome (Android or computer). Listening on this device works everywhere.';
    return;
  }
  ctx = cast.framework.CastContext.getInstance();
  ctx.setOptions({
    receiverApplicationId: chrome.cast.media.DEFAULT_MEDIA_RECEIVER_APP_ID,
    autoJoinPolicy: chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED,
    resumeSavedSession: true,
  });
  afterUnjam();
  player = new cast.framework.RemotePlayer();
  ctrl = new cast.framework.RemotePlayerController(player);
  ctrl.addEventListener(cast.framework.RemotePlayerEventType.ANY_CHANGE, () => { onSpeakerState(); render(); });
  ctx.addEventListener(cast.framework.CastContextEventType.CAST_STATE_CHANGED, e => {
    diag('cast state: ' + e.castState);
    if (castListOpen && e.castState === cast.framework.CastState.NO_DEVICES_AVAILABLE) unjamCasting();
    render();
  });
  ctx.addEventListener(cast.framework.CastContextEventType.SESSION_STATE_CHANGED, e => {
    const S = cast.framework.SessionState;
    diag('session: ' + e.sessionState + (e.errorCode ? ' · error ' + e.errorCode : '')
      + (e.session ? ' · ' + e.session.getCastDevice().friendlyName : ''));
    if (e.sessionState === S.SESSION_STARTED) {
      els.castBtn.classList.remove('nudge'); hideNotice();
      try { sessionStorage.removeItem(UNJAM_KEY); } catch (err) {}
      // A speaker was picked: whatever the phone was playing moves over to it.
      const s = localStation || carryAfterUnjam;
      carryAfterUnjam = null;
      if (s) { stopHere(); loadStation(s); }
    }
    if (e.sessionState === S.SESSION_START_FAILED) showNotice('The speaker didn’t accept the connection. Try again.');
    // Disconnecting carries the music back to the phone (unless the speaker was stopped).
    if (e.sessionState === S.SESSION_ENDING) {
      const r = remoteStation();
      carryOver = r && r !== 'other' && castActive() && !speakerPaused() ? r : null;
    }
    if (e.sessionState === S.SESSION_ENDED) {
      speakerLoading = speakerStation = null; speakerReconnecting = false;
      if (carryOver) { const s = carryOver; carryOver = null; playHere(s); }
    }
    render();
  });
  render();
};

function loadStation(s) {
  const session = ctx.getCurrentSession();
  if (!session) return;
  const info = new chrome.cast.media.MediaInfo(s.url, s.type);
  info.streamType = chrome.cast.media.StreamType.LIVE;

  info.metadata = md;

// The speaker's standard player often plays for half a second, then sits "buffering" for a
// long time before the sound starts. A quick pause and play gets it going, so while a station
// is starting the app watches for that stall and nudges the speaker, up to 4 times.
const NUDGE_AFTER = 500, NUDGE_WINDOW = 60000;

function watchStall() {

  if (Date.now() > nudgeUntil || nudges >= 4 || player.playerState !== PS.BUFFERING) return;
  nudgeTimer = setTimeout(() => {
    const session = ctx.getCurrentSession();
    const media = session && session.getMediaSession();
    if (!media || player.playerState !== PS.BUFFERING) return;
    nudges++;
    kicking = true;
    diag('nudge ' + nudges + ': speaker stalled buffering, pause + play');
    const done = () => { kicking = false; render(); };
    media.pause(new chrome.cast.media.PauseRequest(), () => media.play(new chrome.cast.media.PlayRequest(), done, done), done);

// Watches the speaker: notes when it's really playing, and restarts the station if its stream drops.

  const PS = chrome.cast.media.PlayerState;
  if (player.playerState === lastSpeakerState) return;
  const session = ctx.getCurrentSession();
  const media = session && session.getMediaSession && session.getMediaSession();
  diag('speaker player: ' + (player.playerState || 'none')
    + (player.playerState === PS.IDLE && media && media.idleReason ? ' (' + media.idleReason + ')' : '')
    + (loadStartedAt ? ' · ' + ((performance.now() - loadStartedAt) / 1000).toFixed(2) + 's since sending' : ''));
  watchStall();
  lastSpeakerState = player.playerState;
  if (player.playerState === PS.PLAYING) {
    const r = remoteStation();
    speakerLoading = null; speakerRetries = 0; speakerReconnecting = false;
    speakerStation = r && r !== 'other' ? r : null;
    if (speakerStation) stationWorked(speakerStation);
    return;
  }
  if (player.playerState !== PS.IDLE) return;
  const IR = chrome.cast.media.IdleReason;
  const why = media && media.idleReason;
  // Never got going: this station doesn't play on the speaker.
  if (speakerLoading && why === IR.ERROR) {

    stationFailed(s, 'speaker error');

  const dropped = IR && (why === IR.ERROR || why === IR.FINISHED);
  if (!dropped || speakerRetries >= 4) { speakerStation = null; speakerReconnecting = false; return; }

  speakerRetries++;
  speakerReconnecting = true;

  setTimeout(() => {
    speakerReconnecting = false;
    if (castConnected() && !castActive()) loadStation(s);
    render();

}

function remoteStation() {
  const id = player && player.mediaInfo && player.mediaInfo.contentId;
  return id ? STATIONS.find(s => s.url === id) || 'other' : null;
}

{

async function fetchSong(m) {

      return { text: pair(xs[0].artist, xs[0].title), history: xs.slice(1, 11).map(y => ({ song: pair(y.artist, y.title), at: +y.date * 1000 })).filter(y => y.song) };
    }
    case 'laut': {
      const x = await j(`https://api.laut.fm/station/${m.id}/current_song`);
      // Times look like "2026-10-02 02:10:00 +0200".
      const t = v => Date.parse(String(v || '').replace(' ', 'T').replace(/ ([+-]\d\d)(\d\d)$/, '$1:$2'));
      const start = t(x.started_at), end = t(x.ends_at);
      const r = { text: pair(x.artist && x.artist.name, x.title), start, dur: end > start ? (end - start) / 1000 : 0 };
      // The last songs and how many are listening, once a minute.
      if (++m.n % 4 === 1) {

        if (Array.isArray(last)) r.history = last.filter(y => t(y.started_at) < start).slice(0, 10)
          .map(y => ({ song: pair(y.artist && y.artist.name, y.title), at: t(y.started_at) })).filter(y => y.song);
        if (typeof ppl === 'number') r.listeners = ppl;

    case 'live365': { const x = (await j(`https://api.live365.com/station/${m.id}`))['current-track']; return pair(x.artist, x.title); }
    case 'radioco': return (await j(`https://public.radio.co/stations/${m.id}/status`)).current_track.title;
    case 'azura': {
      const d = await j(m.u), np = d.now_playing;

      const entry = x => x && x.song && x.song.title && !/^(jingle|id|station id|promo|sweeper|liner)$/i.test(x.song.artist || '')
        ? { song: pair(x.song.artist, x.song.title), at: (x.played_at || 0) * 1000 } : null;

// Mini mode: the moment the list starts moving up under the player, the top shrinks to one slim bar, and the list
// rides up with it (glued to the bar's bottom edge, so the top station stays in view). Any scroll up, or a tap on
// the bar, brings the full player back. The height the player gives up is added below the footer, so the page
// length and scroll position never change (on short lists that would snap the scroll back and bounce).
{
  const topEl = document.querySelector('.top'), nowEl = document.querySelector('.player .now'), mainEl = document.querySelector('main');
  if (topEl && mainEl) {
    let mini = false, vt = null;
    const root = document.documentElement;
    const apply = on => {
      if (on) {

        mainEl.style.paddingBottom = h + 'px';   // pad first: the page must never get shorter, even mid-swap
        topEl.classList.add('mini');
        const d = Math.max(0, h - topEl.offsetHeight);
        mainEl.style.paddingBottom = d + 'px';
        root.style.setProperty('--mini-shift', d + 'px');
      } else {
        const d = parseFloat(mainEl.style.paddingBottom) || 0;
        topEl.classList.remove('mini'); mainEl.style.paddingBottom = '';
        root.style.setProperty('--mini-shift', -d + 'px');

      if (vt) vt.skipTransition();
      if (!document.startViewTransition || matchMedia('(prefers-reduced-motion: reduce)').matches) { apply(on); return; }
      topEl.classList.add('vt');

    };

    addEventListener('scroll', () => {
      const y = scrollY, dy = y - lastY;
      if (y <= 2) { setMini(false); lastY = y; return; }   // back at the very top: full player
      if (dy > 4) { setMini(true); lastY = y; }            // the list started moving up: shrink right away
      else if (dy < -6) { setMini(false); lastY = y; }     // scrolled up a bit: full player
    }, { passive: true });
    if (nowEl) nowEl.addEventListener('click', () => { if (mini) { setMini(false); lastY = scrollY; } });
    const mc = document.getElementById('miniCast');
    if (mc) mc.addEventListener('click', () => els.castBtn.click());   // the speaker picker, like the big cast button
  }
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
