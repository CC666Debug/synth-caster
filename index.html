<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Synth Caster</title>
<meta name="description" content="Hundreds of synthwave, darkwave, Halloween and chiptune radio streams. Search, sort, shuffle, and cast to Nest speakers.">
<meta name="theme-color" content="#0d0a1a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #0d0a1a;
    --surface: #17122b;
    --surface-2: #221a3d;
    --line: #342a57;
    --text: #f1ecff;
    --muted: #a79dc9;
    --accent: #ff3fa4;
    --accent-2: #33e1ff;
    --accent-ink: #1a0514;
    --good: #6ff0a8;
    --warn: #ffcf5c;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    background-image: linear-gradient(180deg, rgba(255, 63, 164, .10), transparent 260px);
    color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100dvh;
    padding: 0 16px max(24px, env(safe-area-inset-bottom));
    -webkit-tap-highlight-color: transparent;
  }
  main { max-width: 560px; min-width: 0; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  h1 { font-size: 19px; margin: 0; letter-spacing: .2px; white-space: nowrap; cursor: default; user-select: none; }
  h1 span { background: linear-gradient(90deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  @media (max-width: 380px) { h1 { font-size: 17px; } .cast-btn { padding: 9px 12px; } }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; }
  button:disabled { opacity: .45; cursor: default; }

  .cast-btn {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--surface-2); border: 1px solid var(--line);
    padding: 10px 14px; border-radius: 999px; max-width: 60%;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .cast-btn svg { flex: none; width: 20px; height: 20px; }
  .cast-btn.connected { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .cast-btn.connecting svg { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  .cast-btn.nudge { border-color: var(--accent); animation: glow 1.2s ease-in-out infinite; }
  @keyframes glow { 50% { box-shadow: 0 0 0 4px rgba(255, 63, 164, .35); } }
  @media (prefers-reduced-motion: reduce) { .cast-btn.nudge { animation: none; } }

  .notice {
    background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--warn);
    padding: 12px 14px; border-radius: 12px; color: var(--muted); font-size: 14px;
  }
  .notice[hidden] { display: none; }

  /* Now playing and the controls share one slim card. */
  .player {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 10px 12px 6px; display: flex; flex-direction: column; gap: 4px;
  }
  .now { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 10px; align-items: center; }
  .badge {
    width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; font-size: 22px;
    background: linear-gradient(135deg, #3a1a5c, #13304a);
  }
  .now .label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .now .label .state { text-transform: none; letter-spacing: 0; }
  .now .label .state.live { color: var(--good); }
  .now .title { font-weight: 650; font-size: 15px; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .now .song { font-size: 13px; color: var(--accent-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .now .song:empty { display: none; }

  .row { display: flex; align-items: center; gap: 2px; }
  .play {
    width: 46px; height: 46px; border-radius: 50%; flex: none; margin: 0 2px;
    background: var(--accent); color: var(--accent-ink); display: grid; place-items: center;
  }
  .play svg { width: 24px; height: 24px; }
  .icon-btn { background: none; padding: 9px; display: grid; place-items: center; color: var(--muted); border-radius: 50%; flex: none; }
  .icon-btn svg { width: 22px; height: 22px; }
  .icon-btn[hidden] { display: none; }
  .icon-btn.on { color: var(--accent-2); background: rgba(51, 225, 255, .12); }
  input[type=range] { flex: 1; accent-color: var(--accent); height: 28px; min-width: 40px; margin-left: 2px; }

  /* The player, search, genres and sort stay pinned at the top while the station list scrolls under them. */
  .top {
    position: sticky; top: 0; z-index: 3; display: flex; flex-direction: column; gap: 8px;
    background: var(--bg); padding: max(12px, env(safe-area-inset-top)) 0 8px;
    box-shadow: 0 10px 12px -6px var(--bg);
  }
  @media (max-height: 560px) { .top { position: static; box-shadow: none; } }   /* phone on its side: too short to pin */
  .finder { display: flex; flex-direction: column; gap: 8px; }
  .search-row { display: flex; gap: 8px; }
  .search-row .search { flex: 1; min-width: 0; }
  .to-top {
    position: fixed; right: 16px; bottom: max(20px, env(safe-area-inset-bottom)); z-index: 4;
    width: 50px; height: 50px; border-radius: 50%; display: grid; place-items: center;
    background: var(--surface-2); border: 1px solid var(--accent-2); color: var(--accent-2);
    box-shadow: 0 4px 14px rgba(0, 0, 0, .5); transition: opacity .2s, transform .2s;
  }
  .to-top svg { width: 26px; height: 26px; }
  .to-top.hide { opacity: 0; transform: translateY(12px); pointer-events: none; }
  .search { position: relative; }
  .search input {
    width: 100%; font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--line);
    border-radius: 12px; padding: 10px 34px 10px 38px; outline: none;
  }
  .search input:focus { border-color: var(--accent-2); }
  .search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); }
  .search button { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); background: none; color: var(--muted); padding: 8px 10px; font-size: 18px; line-height: 1; }
  .search button[hidden] { display: none; }
  .chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .chips::-webkit-scrollbar { display: none; }
  @media (pointer: fine) { .chips { cursor: grab; } .chips.dragging { cursor: grabbing; user-select: none; } }
  .chip {
    flex: none; background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
    padding: 7px 12px; font-size: 14px; white-space: nowrap; color: var(--muted);
  }
  .chip.on { background: var(--surface-2); border-color: var(--accent); color: var(--text); }
  .chip b { font-weight: 400; opacity: .7; margin-left: 4px; font-size: 12px; }
  .sort {
    flex: none; width: 108px; font: inherit; font-size: 14px; color: var(--text); background: var(--surface);
    border: 1px solid var(--line); border-radius: 12px; padding: 0 8px;
  }
  .count { font-size: 12px; color: var(--muted); margin: -2px 0 -4px; }

  .list { display: flex; flex-direction: column; gap: 6px; }
  .st {
    display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line);
    border-radius: 12px; padding: 4px 4px 4px 12px; min-height: 52px;
  }
  .st.active { border-color: var(--accent); background: var(--surface-2); }
  .st.failed .nm { opacity: .55; }
  .st .pick { flex: 1; min-width: 0; text-align: left; background: none; padding: 8px 0; display: flex; flex-direction: column; gap: 2px; }
  .st .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .st .gr { font-size: 12px; color: var(--muted); }
  .st .dot { display: none; width: 8px; height: 8px; border-radius: 50%; background: var(--good); margin-right: 6px; vertical-align: middle; }
  .st.active .dot { display: inline-block; }
  .star { background: none; font-size: 20px; padding: 10px; color: var(--muted); line-height: 1; }
  .star.on { color: var(--warn); }
  .empty { text-align: center; color: var(--muted); padding: 30px 10px; }
  .more { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; color: var(--muted); }

  dialog { background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; width: min(520px, calc(100vw - 32px)); }
  dialog::backdrop { background: rgba(0, 0, 0, .6); }
  #diagText { max-height: 55vh; overflow: auto; font-size: 11px; white-space: pre-wrap; background: var(--bg); padding: 8px; border-radius: 8px; }
  .dlg-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px; }
  .dlg-btns button { background: var(--surface-2); border: 1px solid var(--line); padding: 8px 12px; border-radius: 8px; }
  footer { text-align: center; color: var(--muted); font-size: 12px; padding-top: 6px; }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<main>
  <div class="top">
  <header>
    <h1>🌆 <span>Synth Caster</span></h1>
    <button class="cast-btn" id="castBtn" aria-label="Cast to a speaker">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M1 18v3h3c0-1.66-1.34-3-3-3zm0-4v2c2.76 0 5 2.24 5 5h2c0-3.87-3.13-7-7-7zm0-4v2a9 9 0 0 1 9 9h2c0-6.08-4.93-11-11-11zm20-7H3c-1.1 0-2 .9-2 2v3h2V5h18v14h-7v2h7c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>
      <span id="castLabel">Speakers</span>
    </button>
  </header>

  <div class="notice" id="notice" hidden></div>

  <section class="player">
  <div class="now" aria-live="polite">
    <div class="badge" id="badge">🌆</div>
    <div style="min-width:0">
      <div class="label"><span id="where">Ready</span> <span class="state" id="nowState"></span></div>
      <div class="title" id="nowName">Pick a station, or tap shuffle</div>
      <div class="song" id="nowSong"></div>
    </div>
  </div>
    <div class="row">
      <button class="icon-btn" id="shuffleBtn" aria-label="Shuffle" title="Shuffle">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10.59 9.17 5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
      </button>
      <button class="icon-btn" id="prevBtn" aria-label="Previous station" title="Previous station">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
      </button>
      <button class="play" id="playBtn" aria-label="Play">
        <svg viewBox="0 0 24 24" fill="currentColor" id="playIcon"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="icon-btn" id="nextBtn" aria-label="Next station" title="Next station">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>
      <button class="icon-btn" id="disconnectBtn" aria-label="Disconnect speaker" title="Disconnect speaker" hidden>
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      </button>
      <button class="icon-btn" id="muteBtn" aria-label="Mute">
        <svg viewBox="0 0 24 24" fill="currentColor" id="volIcon"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
      </button>
      <input type="range" id="vol" min="0" max="100" value="80" aria-label="Volume">
    </div>
  </section>

  <section class="finder">
    <div class="search-row">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <input type="search" id="q" placeholder="Search stations" autocomplete="off" enterkeyhint="search" aria-label="Search stations">
      <button id="qClear" aria-label="Clear search" hidden>×</button>
    </div>
    <select class="sort" id="sort" aria-label="Sort stations">
      <option value="az">A → Z</option>
      <option value="za">Z → A</option>
      <option value="genre">Genre</option>
      <option value="recent">Recent</option>
      <option value="favs">Favorites</option>
      <option value="random">Random</option>
    </select>
    </div>
    <div class="chips" id="chips" role="tablist" aria-label="Genres"></div>
  </section>
  </div>

  <div class="count" id="count"></div>

  <section class="list" id="list" aria-label="Stations"></section>

  <button class="to-top hide" id="toTop" aria-label="Back to top and search" title="Back to top">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7.41 15.41 12 10.83l4.59 4.58L18 14l-6-6-6 6z"/></svg>
  </button>

  <footer>A free fan app. Streams belong to their stations. <span id="ver"></span></footer>
</main>

<dialog id="diagDlg">
  <div id="diagText"></div>
  <div class="dlg-btns">
    <button id="diagClear">Clear</button>
    <button id="diagCopy">Copy log</button>
    <button onclick="this.closest('dialog').close()">Close</button>
  </div>
</dialog>

<script>
const VERSION = '1.4.2';
const $ = id => document.getElementById(id);
const els = {
  castBtn: $('castBtn'), castLabel: $('castLabel'), notice: $('notice'), where: $('where'),
  nowName: $('nowName'), nowSong: $('nowSong'), nowState: $('nowState'), badge: $('badge'), playBtn: $('playBtn'), playIcon: $('playIcon'),
  prevBtn: $('prevBtn'), nextBtn: $('nextBtn'), shuffleBtn: $('shuffleBtn'), disconnectBtn: $('disconnectBtn'),
  muteBtn: $('muteBtn'), volIcon: $('volIcon'), vol: $('vol'), q: $('q'), qClear: $('qClear'),
  chips: $('chips'), sort: $('sort'), count: $('count'), list: $('list'),
};
$('ver').textContent = 'v' + VERSION;

function safeGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function safeSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function loadJSON(k, fallback) { try { return JSON.parse(safeGet(k)) || fallback; } catch (e) { return fallback; } }

// ── Diagnostic log (tap the title 5 times) ──────
const DIAG_KEY = 'sc_diag';
let diagLines = loadJSON(DIAG_KEY, []);
function diag(msg) {
  const t = new Date();
  diagLines.push(t.toLocaleTimeString() + '  ' + msg);
  if (diagLines.length > 300) diagLines = diagLines.slice(-300);
  safeSet(DIAG_KEY, JSON.stringify(diagLines));
}
// How it was opened: its own app window (installed) or an ordinary browser tab.
const openedAs = ['standalone', 'minimal-ui', 'fullscreen', 'browser'].find(m => matchMedia('(display-mode: ' + m + ')').matches) || 'unknown';
diag('── opened · Synth Caster v' + VERSION + ' · ' + (openedAs === 'browser' ? 'browser tab' : 'app window (' + openedAs + ')')
  + (document.referrer ? ' · from ' + document.referrer : '') + ' · ' + navigator.userAgent);

const GENRES = [
  { id: 'Halloween', label: '🎃 Halloween', icon: '🎃' },
  { id: 'Synthwave / Retrowave', label: '🌆 Synthwave', icon: '🌆' },
  { id: 'Darkwave / Goth / Industrial', label: '🦇 Darkwave & Goth', icon: '🦇' },
  { id: 'Chiptune / Game', label: '👾 Chiptune & Game', icon: '👾' },
];
const iconFor = s => (GENRES.find(g => g.id === s.group) || {}).icon || '📻';
const shortGenre = s => ((GENRES.find(g => g.id === s.group) || {}).label || s.group).replace(/^\S+ /, '');

let STATIONS = [];
let favs = new Set(loadJSON('sc_favs', []));
let recent = loadJSON('sc_recent', {});      // id -> last played time
let failed = loadJSON('sc_failed', {});      // id -> time it last failed to play
let filter = safeGet('sc_filter') || 'all';
let sortBy = safeGet('sc_sort') || 'az';
let shuffle = safeGet('sc_shuffle') === '1';
let query = '';
let selected = null;           // the station shown in Now playing
let history = [];              // stations played this visit, for the Previous button
let randomOrder = new Map();   // id -> random number, for the Random sort
const PAGE = 120;              // stations drawn at a time (the list is long)
let shown = PAGE;

els.sort.value = sortBy;

// ── Station list: search, genre, sort ───────────
function norm(s) { return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }

function visible() {
  const words = norm(query).split(/\s+/).filter(Boolean);
  let list = STATIONS.filter(s => {
    if (filter === 'favs' && !favs.has(s.id)) return false;
    if (filter !== 'all' && filter !== 'favs' && s.group !== filter) return false;
    return words.every(w => s.search.includes(w));
  });
  const byName = (a, b) => a.sortName.localeCompare(b.sortName);
  const cmp = {
    az: byName,
    za: (a, b) => byName(b, a),
    genre: (a, b) => GENRES.findIndex(g => g.id === a.group) - GENRES.findIndex(g => g.id === b.group) || byName(a, b),
    recent: (a, b) => (recent[b.id] || 0) - (recent[a.id] || 0) || byName(a, b),
    favs: (a, b) => favs.has(b.id) - favs.has(a.id) || byName(a, b),
    random: (a, b) => randomOrder.get(a.id) - randomOrder.get(b.id),
  }[sortBy] || byName;
  return list.sort(cmp);
}

function renderChips() {
  const counts = { all: STATIONS.length, favs: STATIONS.filter(s => favs.has(s.id)).length };
  GENRES.forEach(g => { counts[g.id] = STATIONS.filter(s => s.group === g.id).length; });
  const chips = [{ id: 'all', label: 'All' }, { id: 'favs', label: '★ Favorites' }, ...GENRES];
  els.chips.innerHTML = '';
  chips.forEach(c => {
    const b = document.createElement('button');
    b.className = 'chip' + (filter === c.id ? ' on' : '');
    b.setAttribute('role', 'tab');
    b.setAttribute('aria-selected', filter === c.id);
    b.innerHTML = `${c.label}<b>${counts[c.id]}</b>`;
    b.addEventListener('click', () => { filter = c.id; safeSet('sc_filter', filter); shown = PAGE; renderChips(); renderList(); listToTop(); });
    els.chips.appendChild(b);
  });
}

function esc(t) { return t.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

function renderList() {
  const list = visible();
  els.count.textContent = list.length === 1 ? '1 station' : list.length + ' stations';
  els.list.innerHTML = '';
  if (!list.length) {
    els.list.innerHTML = `<div class="empty">${filter === 'favs' && !query ? 'No favorites yet. Tap ☆ on a station to add it.' : 'No stations match.'}</div>`;
    return;
  }
  const frag = document.createDocumentFragment();
  list.slice(0, shown).forEach(s => {
    const row = document.createElement('div');
    row.className = 'st' + (s === playingStation() ? ' active' : '') + (failed[s.id] ? ' failed' : '');
    row.innerHTML = `<button class="pick"><span class="nm"><span class="dot"></span>${esc(s.name)}</span>`
      + `<span class="gr">${iconFor(s)} ${esc(shortGenre(s))}${s.meta ? ' · ♪ song names' : ''}${failed[s.id] ? ' · didn’t play last time' : s.insecure ? ' · older link, may not play on phones' : ''}</span></button>`
      + `<button class="star${favs.has(s.id) ? ' on' : ''}" aria-label="${favs.has(s.id) ? 'Remove from' : 'Add to'} favorites">${favs.has(s.id) ? '★' : '☆'}</button>`;
    row.querySelector('.pick').addEventListener('click', () => chooseStation(s));
    row.querySelector('.star').addEventListener('click', () => toggleFav(s));
    frag.appendChild(row);
  });
  if (list.length > shown) {
    const more = document.createElement('button');
    more.className = 'more';
    more.textContent = `Show ${Math.min(PAGE, list.length - shown)} more (${list.length - shown} left)`;
    more.addEventListener('click', () => { shown += PAGE; renderList(); });
    frag.appendChild(more);
  }
  els.list.appendChild(frag);
}

function toggleFav(s) {
  favs.has(s.id) ? favs.delete(s.id) : favs.add(s.id);
  safeSet('sc_favs', JSON.stringify([...favs]));
  renderChips(); renderList();
}

let qTimer = null;
els.q.addEventListener('input', () => {
  els.qClear.hidden = !els.q.value;
  clearTimeout(qTimer);
  qTimer = setTimeout(() => { query = els.q.value; shown = PAGE; renderList(); listToTop(); }, 120);
});
els.qClear.addEventListener('click', () => { els.q.value = ''; query = ''; els.qClear.hidden = true; shown = PAGE; renderList(); listToTop(); els.q.focus(); });
els.sort.addEventListener('change', () => {
  sortBy = els.sort.value; safeSet('sc_sort', sortBy);
  if (sortBy === 'random') reshuffleOrder();
  shown = PAGE; renderList(); listToTop();
});
// On a computer, the genre bar scrolls by click-and-drag or the mouse wheel (phones just swipe).
{
  const bar = els.chips;
  let startX = 0, startScroll = 0, dragging = false, moved = false;
  bar.addEventListener('pointerdown', e => {
    if (e.pointerType !== 'mouse' || e.button !== 0) return;
    dragging = true; moved = false;
    startX = e.clientX; startScroll = bar.scrollLeft;
  });
  addEventListener('pointermove', e => {
    if (!dragging) return;
    const dx = e.clientX - startX;
    if (Math.abs(dx) > 4) { moved = true; bar.classList.add('dragging'); }

  els.disconnectBtn.hidden = !session;
  els.shuffleBtn.classList.toggle('on', shuffle);
  els.shuffleBtn.setAttribute('aria-pressed', shuffle);

  const s = playingStation() || selected;
  els.badge.textContent = s ? iconFor(s) : '🌆';
  els.nowName.textContent = s ? s.name : 'Pick a station, or tap shuffle';
  let where = 'Ready', st = '', live = false, icon = ICON_PLAY;
  if (session) {
    where = 'On ' + device;
    const PS = chrome.cast.media.PlayerState;
    if (speakerLoading) { st = 'Starting on the speaker…'; icon = ICON_STOP; }
    else if (speakerReconnecting) { st = 'Reconnecting…'; icon = ICON_STOP; }
    else if (castActive() && player.playerState === PS.PAUSED && !kicking) { st = 'Paused'; icon = ICON_PLAY; }
    else if (castActive() && player.playerState === PS.BUFFERING) { st = 'Buffering…'; icon = ICON_PAUSE; }
    else if (castActive()) { st = 'Playing'; live = true; icon = remoteStation() === 'other' ? ICON_STOP : ICON_PAUSE; }
    else st = s ? 'Stopped' : '';
    if (castConnected() && player && player.isMuted) st += ' · muted';
  } else if (localStation) {
    where = 'On this device';
    icon = ICON_STOP;
    if (reconnecting === 'offline') st = 'No signal. Waiting to reconnect…';
    else if (reconnecting) st = 'Reconnecting…';
    else if (hereLive) { st = 'Playing'; live = true; }
    else st = 'Tuning in…';
    if (audio.muted) st += ' · muted';
  }
  if (s && shuffle) where += ' · shuffle';
  els.where.textContent = where;
  els.nowState.textContent = st ? '· ' + st : '';
  els.nowState.classList.toggle('live', live);
  els.playIcon.innerHTML = icon;
  els.playBtn.setAttribute('aria-label', icon === ICON_PLAY ? 'Play' : icon === ICON_PAUSE ? 'Pause' : 'Stop');
  const muted = castConnected() ? player && player.isMuted : audio.muted;
  els.volIcon.innerHTML = muted ? ICON_MUTED : ICON_VOL;
  if (castConnected() && player && !volTimer) els.vol.value = Math.round((player.volumeLevel || 0) * 100);
  document.title = s && (live || localStation) ? s.name + ' · Synth Caster' : 'Synth Caster';

  const activeId = (playingStation() || {}).id || null;
  if (activeId !== lastActiveId) { lastActiveId = activeId; startMeta(playingStation()); renderList(); updateMediaSession(); }
}

// Tap the title 5 times within 3 seconds to open the diagnostic log.
{
  const dlg = $('diagDlg'), text = $('diagText');
  let taps = [];
  document.querySelector('h1').addEventListener('click', () => {
    const now = Date.now();
    taps = taps.filter(x => now - x < 3000).concat(now);
    if (taps.length < 5) return;
    taps = [];
    text.textContent = diagLines.join('\n') || '(empty)';
    dlg.showModal();
    text.scrollTop = text.scrollHeight;
  });
  $('diagCopy').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(diagLines.join('\n')); $('diagCopy').textContent = 'Copied ✓'; }
    catch (e) { getSelection().selectAllChildren(text); $('diagCopy').textContent = 'Selected: copy it'; }
    setTimeout(() => { $('diagCopy').textContent = 'Copy log'; }, 2500);
  });
  $('diagClear').addEventListener('click', () => {
    diagLines = [];
    try { localStorage.removeItem(DIAG_KEY); } catch (e) {}
    text.textContent = '(empty)';
  });
}

// ── Start up ────────────────────────────────────
async function start() {
  try {
    const res = await fetch('stations.json', { cache: 'no-cache' });
    STATIONS = await res.json();
  } catch (e) {
    showNotice('Couldn’t load the station list. Check your connection and refresh.');
    diag('station list failed: ' + e);
    return;
  }
  STATIONS.forEach(s => {
    s.sortName = norm(s.name).replace(/^[^\p{L}\p{N}]+/u, '');
    s.search = norm(s.name + ' ' + s.group + ' ' + (s.tags || ''));
  });
  if (filter !== 'all' && filter !== 'favs' && !GENRES.some(g => g.id === filter)) filter = 'all';
  reshuffleOrder();
  selected = STATIONS.find(s => s.id === safeGet('sc_station')) || null;
  diag('stations loaded: ' + STATIONS.length);
  renderChips();
  renderList();
  render();
  // The cast library loads after the station list, so a rejoined speaker can be matched to its station.
  const cs = document.createElement('script');
  cs.src = 'https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1';
  cs.onerror = () => { diag('cast library failed to load'); els.castLabel.textContent = 'Unavailable'; };
  document.head.appendChild(cs);
}
start();

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
